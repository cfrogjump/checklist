<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Checklist</title>
<style>
  :root {
    --paper: #faf7f2;
    --ink: #2b2620;
    --rule: #ddd5c8;
    --accent: #b0592f;
    --accent-soft: #e9d9cd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 32px 16px 80px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2rem;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 12px;
  }
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 16px 0 28px;
    font-size: 0.85rem;
    color: #6b6459;
  }
  .bar {
    flex: 1;
    height: 8px;
    background: var(--rule);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.25s ease;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--rule);
    color: #6b6459;
    font-size: 0.8rem;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }
  .status {
    font-size: 0.72rem;
    color: #a39a8c;
    text-align: right;
    margin-top: -18px;
    margin-bottom: 18px;
  }
  .group-block { margin-bottom: 18px; }
  .block-header { display: flex; align-items: center; gap: 6px; }
  .block-header h2 { margin: 0; padding: 0; }
  .drag-handle {
    background: none;
    border: none;
    padding: 2px 6px;
    margin-left: -6px;
    color: #a39a8c;
    font-size: 1.05rem;
    line-height: 1;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .drag-handle:active { cursor: grabbing; color: var(--accent); }
  .group-block.dragging {
    opacity: 0.92;
    background: var(--paper);
    box-shadow: 0 6px 18px rgba(43, 38, 32, 0.18);
    border-radius: 8px;
    position: relative;
    z-index: 5;
  }
  .drag-active .area-title { opacity: 0.35; }
  .add-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--rule);
    color: var(--accent);
    border-radius: 6px;
    width: 26px;
    height: 26px;
    line-height: 1;
    font-size: 1.05rem;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }
  .add-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  li.add-row { border-bottom: none; padding: 8px 4px; }
  .add-row form { display: flex; flex: 1; gap: 8px; min-width: 0; }
  .add-row input {
    flex: 1;
    min-width: 0;
    font: inherit;
    padding: 6px 10px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  .add-row input:focus { outline: none; border-color: var(--accent); }
  .add-save {
    background: var(--accent);
    border: none;
    color: #fff;
    font-size: 0.85rem;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
  .add-save:disabled { opacity: 0.6; cursor: default; }
  .quest-title {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--accent);
  }
  .area-title {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 0.75rem;
    color: var(--accent);
    font-weight: 700;
    margin: 24px 0 6px;
  }
  h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.3rem;
    margin: 0 0 10px;
    padding-top: 6px;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 4px;
    border-bottom: 1px solid var(--rule);
    font-size: 1rem;
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] {
    margin-top: 3px;
    width: 18px;
    height: 18px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  li label { cursor: pointer; flex: 1; }
  li.checked label {
    color: #a39a8c;
    text-decoration: line-through;
  }
  .quest-box {
    border: 1px dashed var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    background: var(--accent-soft);
    margin-top: 10px;
  }
  .quest-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: #6b6459;
    margin: 12px 0 4px;
    font-weight: 600;
  }
  .quest-option .add-btn { width: 22px; height: 22px; font-size: 0.95rem; }
  .quest-option:first-child { margin-top: 0; }
  footer {
    text-align: center;
    font-size: 0.75rem;
    color: #a39a8c;
    margin-top: 40px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Party Checklist</h1>
  <div class="progress-row">
    <span id="progressLabel">0 / 0 done</span>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <button class="reset-btn" id="resetBtn">Reset all</button>
  </div>
  <div class="status" id="statusLine">syncing…</div>
  <div id="content"></div>
  <footer>Shared checklist — changes sync to everyone with this link.</footer>
</div>

<script>
const content = document.getElementById("content");
let blocks = [];   // draggable units: one per group, floor groups merged into "floorquest"
let state = {};
let totalItems = 0;
let dragging = false;
let editing = false;  // an "add task" input is open

function fmtId(groupId, idx) { return groupId + "-" + idx; }

// The three floor groups render inside one quest box, so they drag as a
// single unit anchored wherever the first floor group sits in the order.
function buildBlocks(groups) {
  const out = [];
  let quest = null;
  groups.forEach(g => {
    if (g.id.startsWith("floor")) {
      if (!quest) {
        quest = { id: "floorquest", groups: [] };
        out.push(quest);
      }
      quest.groups.push(g);
    } else {
      out.push({ id: g.id, groups: [g] });
    }
  });
  return out;
}

function render() {
  content.innerHTML = "";
  totalItems = 0;
  let lastSection = null;
  blocks.forEach(block => {
    const section = block.groups[0].section;
    if (section !== lastSection) {
      const heading = document.createElement("div");
      heading.className = "area-title";
      heading.textContent = section;
      content.appendChild(heading);
      lastSection = section;
    }
    content.appendChild(renderBlock(block));
  });
  updateProgress();
}

function renderBlock(block) {
  const wrap = document.createElement("div");
  wrap.className = "group-block";
  wrap.dataset.blockId = block.id;

  const header = document.createElement("div");
  header.className = "block-header";
  const handle = document.createElement("button");
  handle.className = "drag-handle";
  handle.type = "button";
  handle.textContent = "\u283f";
  handle.setAttribute("aria-label", "Drag to reorder");
  header.appendChild(handle);

  if (block.id === "floorquest") {
    const box = document.createElement("div");
    box.className = "quest-box";
    const title = document.createElement("div");
    title.className = "quest-title";
    title.textContent = "Floor Side Quest";
    header.appendChild(title);
    box.appendChild(header);
    block.groups.forEach(fg => {
      const row = document.createElement("div");
      row.className = "quest-option";
      const label = document.createElement("span");
      const sub = fg.title.split("\u2014")[1];
      label.textContent = sub ? sub.trim() : fg.title;
      row.appendChild(label);
      box.appendChild(row);
      const ul = document.createElement("ul");
      box.appendChild(ul);
      fillList(ul, fg);
      row.appendChild(makeAddButton(fg.id, ul));
    });
    wrap.appendChild(box);
  } else {
    const group = block.groups[0];
    const h2 = document.createElement("h2");
    h2.textContent = group.title;
    header.appendChild(h2);
    wrap.appendChild(header);
    const ul = document.createElement("ul");
    wrap.appendChild(ul);
    fillList(ul, group);
    header.appendChild(makeAddButton(group.id, ul));
  }

  handle.addEventListener("pointerdown", e => startDrag(e, wrap, handle));
  return wrap;
}

// ---- drag to reorder ------------------------------------------------------
// Pointer events (not HTML5 drag-and-drop) so it works on touch screens.

let scrollRAF = 0;
let lastPointerY = 0;

function startDrag(e, blockEl, handle) {
  e.preventDefault();
  dragging = true;
  lastPointerY = e.clientY;
  blockEl.classList.add("dragging");
  content.classList.add("drag-active");
  // Keeps touch pointers feeding us moves; window listeners below do the
  // actual work so the drag also survives losing capture.
  try { handle.setPointerCapture(e.pointerId); } catch (err) {}

  const onMove = ev => {
    lastPointerY = ev.clientY;
    positionBlock(blockEl, ev.clientY);
  };
  const onUp = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    cancelAnimationFrame(scrollRAF);
    blockEl.classList.remove("dragging");
    content.classList.remove("drag-active");
    dragging = false;
    commitOrder();
  };
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);

  // Keep scrolling while the pointer is held near the viewport edge.
  const scrollLoop = () => {
    if (!dragging) return;
    const margin = 70, step = 12;
    if (lastPointerY < margin) window.scrollBy(0, -step);
    else if (lastPointerY > window.innerHeight - margin) window.scrollBy(0, step);
    positionBlock(blockEl, lastPointerY);
    scrollRAF = requestAnimationFrame(scrollLoop);
  };
  scrollRAF = requestAnimationFrame(scrollLoop);
}

function positionBlock(blockEl, y) {
  const others = [...content.querySelectorAll(".group-block")].filter(el => el !== blockEl);
  let target = null;
  for (const el of others) {
    const r = el.getBoundingClientRect();
    if (y < r.top + r.height / 2) { target = el; break; }
  }
  if (target) content.insertBefore(blockEl, target);
  else content.appendChild(blockEl);
}

function commitOrder() {
  const ids = [...content.querySelectorAll(".group-block")].map(el => el.dataset.blockId);
  blocks.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  render();  // fixes up the section headings around the new order
  postOrder();
}

async function postOrder() {
  const order = [];
  blocks.forEach(b => b.groups.forEach(g => order.push(g.id)));
  try {
    const res = await fetch("/api/order", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ order }),
    });
    setStatus(res.ok ? "synced" : "couldn't save order");
  } catch (e) {
    setStatus("offline \u2014 will retry");
  }
}

function fillList(ul, group) {
  const entries = group.items.map((text, idx) => ({ id: fmtId(group.id, idx), text }));
  (group.extras || []).forEach(x => entries.push({ id: x.id, text: x.text }));
  entries.forEach(entry => {
    totalItems++;
    const checked = !!state[entry.id];
    const li = document.createElement("li");
    if (checked) li.classList.add("checked");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = entry.id;
    cb.checked = checked;
    const label = document.createElement("label");
    label.htmlFor = entry.id;
    label.textContent = entry.text;  // textContent: item text is user-supplied
    li.append(cb, label);
    ul.appendChild(li);
    cb.addEventListener("change", () => toggle(entry.id, cb.checked, li));
  });
}

// ---- add a task -----------------------------------------------------------

function makeAddButton(groupId, ul) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "add-btn";
  btn.textContent = "+";
  btn.title = "Add a task";
  btn.setAttribute("aria-label", "Add a task to this section");
  btn.addEventListener("click", () => openAddRow(groupId, ul));
  return btn;
}

function openAddRow(groupId, ul) {
  const existing = ul.querySelector(".add-row");
  if (existing) { existing.querySelector("input").focus(); return; }
  editing = true;

  const li = document.createElement("li");
  li.className = "add-row";
  const form = document.createElement("form");
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "New task…";
  input.maxLength = 200;
  const save = document.createElement("button");
  save.type = "submit";  // real form: Enter submits, phones show a "Go" key
  save.className = "add-save";
  save.textContent = "Add";
  form.append(input, save);
  li.appendChild(form);
  ul.appendChild(li);
  input.focus();

  const close = () => {
    li.remove();
    editing = !!document.querySelector(".add-row");
  };
  const submit = async () => {
    if (save.disabled) return;
    const text = input.value.trim();
    if (!text) { close(); return; }
    save.disabled = true;
    try {
      const res = await fetch("/api/add-item", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ group: groupId, text }),
      });
      const data = await res.json();
      if (!res.ok) {
        setStatus(data.error || "couldn't add task");
        save.disabled = false;
        return;
      }
      editing = false;
      blocks = buildBlocks(data.groups);
      state = data.state;
      render();
      setStatus("synced");
    } catch (e) {
      setStatus("offline — try again");
      save.disabled = false;
    }
  };
  form.addEventListener("submit", ev => {
    ev.preventDefault();
    submit();
  });
  input.addEventListener("keydown", ev => {
    if (ev.key === "Escape") close();
  });
}

async function toggle(id, checked, li) {
  li.classList.toggle("checked", checked);
  state[id] = checked;
  updateProgress();
  try {
    const res = await fetch("/api/toggle", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, checked }),
    });
    const data = await res.json();
    if (data.state) state = data.state;
    setStatus("synced");
  } catch (e) {
    setStatus("offline — will retry");
  }
}

function updateProgress() {
  const doneCount = Object.values(state).filter(Boolean).length;
  document.getElementById("progressLabel").textContent = `${doneCount} / ${totalItems} done`;
  const pct = totalItems ? Math.round((doneCount / totalItems) * 100) : 0;
  document.getElementById("barFill").style.width = pct + "%";
}

function setStatus(text) {
  document.getElementById("statusLine").textContent = text;
}

async function loadChecklist() {
  if (dragging || editing) return;  // don't yank the list out from under a drag or typing
  try {
    const res = await fetch("/api/checklist");
    const data = await res.json();
    if (dragging || editing) return;  // may have started while we were fetching
    blocks = buildBlocks(data.groups);
    state = data.state;
    render();
    setStatus("synced just now");
  } catch (e) {
    setStatus("couldn't reach server");
  }
}

document.getElementById("resetBtn").addEventListener("click", async () => {
  if (!confirm("Clear all checked items for everyone?")) return;
  try {
    const res = await fetch("/api/reset", { method: "POST" });
    const data = await res.json();
    state = data.state || {};
    render();
    setStatus("synced");
  } catch (e) {
    setStatus("couldn't reach server");
  }
});

// Initial load, then poll periodically so everyone sees each other's checks.
loadChecklist();
setInterval(loadChecklist, 4000);
</script>
</body>
</html>
