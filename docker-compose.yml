services:
  checklist:
    # Published by CI on every push to main. `docker compose pull` fetches it,
    # so the box running this doesn't need to build anything. `build:` is kept
    # so `docker compose up -d --build` still works for local changes.
    image: ghcr.io/cfrogjump/checklist:latest
    build: .
    container_name: party-checklist
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    # Sign-in is a first-name guest list hardcoded in checklist_items' sibling
    # server.py (ALLOWED_NAMES) — no credentials to configure here.
    restart: unless-stopped
