name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the Dockerfile's python:3.12-alpine.
          python-version: "3.12"

      - name: Check the server compiles
        run: python -m compileall -q server.py checklist_items.py

      - name: Run tests
        # Warnings as errors so a leaked socket or deprecation fails the build.
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the inline page script parses
        run: |
          sed -n '/^<script>/,/^<\/script>/p' index.html | sed '1d;$d' > /tmp/page.js
          test -s /tmp/page.js || { echo "no inline script extracted"; exit 1; }
          node --check /tmp/page.js

  build:
    name: Build and push
    runs-on: ubuntu-latest
    needs: test
    # Only publish from main — PRs get built by the image-builds job below.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the pushed image
        run: |
          docker run -d --name smoke -p 8080:8080 \
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"; break
            fi
            [ "$i" = 20 ] && { docker logs smoke; exit 1; }
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz | grep -q '"ok": true'
          # The app itself must still demand a name.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u cade: http://localhost:8080/)" = 200
          # Icons must have made it into the image.
          curl -fsS -o /dev/null http://localhost:8080/apple-touch-icon.png
          docker rm -f smoke

  image-builds:
    name: Image builds (PR)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build without pushing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: checklist:pr
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test
        run: |
          docker run -d --name smoke -p 8080:8080 checklist:pr
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            [ "$i" = 20 ] && { docker logs smoke; exit 1; }
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -u cade: http://localhost:8080/)" = 200
          docker rm -f smoke
